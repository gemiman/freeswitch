server {
    listen 80;
    server_name localhost;

    location / {
        root /usr/local/freeswitch/recordings;
        autoindex on; # 允许列出目录
        autoindex_exact_size off; # 显示人性化文件大小
        autoindex_localtime on; # 显示服务器时间
    }

    # 也可以专门指定 /recordings 路径
    location /recordings {
        alias /usr/local/freeswitch/recordings;
        autoindex on;
    }
}
