version: '3.8'

services:
  freeswitch:
    image: gemiman/freeswitch:0.0.3-amd64
    container_name: freeswitch_prod
    restart: unless-stopped
    
    # -------------------------------------------------------------------------
    # 网络模式配置 (生产环境核心建议)
    # -------------------------------------------------------------------------
    # Linux 生产环境强烈建议开启 'host' 模式。
    # FreeSWITCH 涉及大量 UDP 端口 (RTP) 和复杂的 SIP 信令，NAT 是万恶之源。
    # 开启 host 模式后，容器直接共享宿主机网络栈，无需端口映射，性能最高。
    # 
    # network_mode: host
    
    # 如果无法使用 host 模式 (如 macOS, Windows 或受限的 K8s/云环境)，
    # 请取消注释下方的 ports 部分。注意：Docker 代理大量 UDP 端口会导致 cpu 高占用和启动缓慢。
    ports:
      # SIP (Internal)
      - "5060:5060/tcp"
      - "5060:5060/udp"
      # SIP (External)
      - "5080:5080/tcp"
      - "5080:5080/udp"
      # SIP TLS
      - "5061:5061/tcp"
      - "5061:5061/udp"
      # ESL (Event Socket Library) - 外部控制接口
      - "8021:8021/tcp"
      # WebRTC (WSS/WS)
      - "7443:7443/tcp"
      - "5066:5066/tcp"
      # Nginx 录音下载服务 (容器内80映射到外部8080)
      - "8080:80/tcp"
      # RTP 语音流端口范围
      # 警告：必须与 switch.conf.xml 中的 rtp-start-port 和 rtp-end-port 一致
      - "16384-32768:16384-32768/udp"

    # -------------------------------------------------------------------------
    # 数据持久化与配置挂载
    # -------------------------------------------------------------------------
    volumes:
      # 配置文件 (首次启动前需从镜像复制出来，见文档)
      - ./conf:/usr/local/freeswitch/conf
      # 录音文件 (Nginx 将服务于此目录)
      - ./recordings:/usr/local/freeswitch/recordings
      # 日志文件
      - ./log:/usr/local/freeswitch/log
      # 内部数据库 (SQLite)
      - ./db:/usr/local/freeswitch/db
      # 同步宿主机时区
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro

    # -------------------------------------------------------------------------
    # 环境变量
    # -------------------------------------------------------------------------
    environment:
      - TZ=Asia/Shanghai
      # SOUND_RATES=8000:16000:32000:48000 (可选：指定加载的音频采样率)
      
      # [安全设置] 启动时自动替换默认密码
      # 注意：这将直接修改 conf/vars.xml 和 conf/autoload_configs/event_socket.conf.xml 文件
      - FS_DEFAULT_PASSWORD=MySecretPass123  # 分机注册密码 (原 1234)
      - FS_ESL_PASSWORD=ClueConStrong        # ESL 接口密码 (原 ClueCon)

    # -------------------------------------------------------------------------
    # 系统资源限制 (生产环境必备)
    # -------------------------------------------------------------------------
    ulimits:
      # 允许生成 Core Dump (调试崩溃用)
      core: -1
      # 增加最大文件打开数 (高并发必备)
      nofile:
        soft: 65536
        hard: 65536
    
    # Docker 资源配额 (防止被 OOM Kill 或占用过多 CPU)
    deploy:
      resources:
        limits:
          cpus: '4'         # 限制最多使用 4 核
          memory: 4G        # 限制最大内存 4G
        reservations:
          memory: 1G        # 预留 1G 内存

    # -------------------------------------------------------------------------
    # 健康检查
    # -------------------------------------------------------------------------
    healthcheck:
      test: ["CMD", "fs_cli", "-x", "status"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

    # -------------------------------------------------------------------------
    # 日志管理 (防止日志撑爆磁盘)
    # -------------------------------------------------------------------------
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "5"
