version: "3.8"

services:
  # ---------------------------------------------------------------------------
  # FreeSWITCH (核心软交换)
  # ---------------------------------------------------------------------------
  freeswitch:
    image: gemiman/freeswitch:0.0.9-amd64
    container_name: freeswitch_webrtc
    restart: unless-stopped

    # [网络模式]
    # 强烈建议 Linux 使用 'host' 模式。WebRTC 涉及海量 UDP 端口，NAT 是最大障碍。
    # 如果是 Mac/Windows 开发，请注释掉 network_mode，并取消 ports 注释（但可能有单通问题）。
    network_mode: host

    # ports:
    #   - "5060:5060/tcp" # SIP TCP
    #   - "5060:5060/udp" # SIP UDP
    #   - "5061:5061/tcp" # SIP TLS
    #   - "5066:5066/tcp" # WS (WebRTC)
    #   - "7443:7443/tcp" # WSS (WebRTC Secure)
    #   - "8021:8021/tcp" # ESL
    #   - "8082:8082/tcp" # Nginx Recordings
    #   - "16384-32768:16384-32768/udp" # RTP Range

    volumes:
      # 配置文件 (启动前请先从镜像复制到本地 conf 目录)
      - ./conf:/usr/local/freeswitch/etc/freeswitch
      - ./recordings:/usr/local/freeswitch/recordings
      - ./log:/usr/local/freeswitch/var/log/freeswitch
      - ./db:/usr/local/freeswitch/var/lib/freeswitch/db
      - ./certs:/usr/local/freeswitch/etc/freeswitch/ssl # 挂载证书目录
      - ./nginx_recordings.conf:/etc/nginx/sites-enabled/default # Nginx 录音服务配置
      - ./nginx.conf:/etc/nginx/nginx.conf # Nginx 主配置 (root用户)
      - ./.htpasswd:/etc/nginx/.htpasswd # Nginx 认证文件
      - /etc/localtime:/etc/localtime:ro

    environment:
      - TZ=Asia/Shanghai
      # 提示: 如果遇到 WebRTC 连接失败，尝试设置外部 IP 变量
      # - EXTERNAL_RTP_IP=1.2.3.4
      # - EXTERNAL_SIP_IP=1.2.3.4

    ulimits:
      core: -1
      nofile:
        soft: 65536
        hard: 65536
      # 允许调整优先级和实时调度
      nice: -20
      rtprio: 99

    healthcheck:
      test: ["CMD", "fs_cli", "-x", "status"]
      interval: 30s
      timeout: 10s
      retries: 3

    cap_add:
      - SYS_NICE
      - SYS_RESOURCE

  # ---------------------------------------------------------------------------
  # Coturn (TURN/STUN 中继服务器)
  # ---------------------------------------------------------------------------
  coturn:
    image: coturn/coturn:4.8.0
    container_name: coturn_server
    restart: always

    # Coturn 必须使用 host 模式，因为它需要监听成千上万个中继端口
    network_mode: host

    volumes:
      - ./turnserver.conf:/etc/coturn/turnserver.conf

    # 启动命令配置
    # 使用配置文件启动 (由 setup.sh 生成)
    command:
      - -n
      - --log-file=stdout
      - -c
      - /etc/coturn/turnserver.conf
